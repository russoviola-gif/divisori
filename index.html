<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./Css/style.css">
    <title>Document</title>
</head>


<body>
    <div class="bg-warning text-center">
        <p class="titolo">SCRIPT JAVASCRIPT</p>
        <p class="sottoTitolo">Una collezione di script Javascript</p>
    </div>
    <div class="container text-center contenitore">
        <div class="row">
            <div class="col-12 col-md-3 border border-warning">
                <h3>COSA FA LO SCRIPT</h3>
                <img src="./Images/js.webp"  class="d-none d-md-block" alt="">
                <p class="bg-primary ">Inserisci un numero e lo script calcolera i divisori</p>
            </div>
            <div class="col-6 col-md-5 border border-warning">
                <h3>IL TUO INPUT</h3>
                <form>
                    <input type="number" id="number" autocomplete="off" placeholder="inserisci numero" value=""> <button
                        type="button" class="btn" onclick="divisore()">CALCOLA</button>
                </form>
            </div>
            <div class="col-6 col-md-4 border border-warning">
                <h3>IL RISULTATO</h3>
                <div class="spinner-border text-danger" id="spinner" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p id="risultato"></p>
            </div>
        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./Js/script.js"></script>
</body>


</html>
